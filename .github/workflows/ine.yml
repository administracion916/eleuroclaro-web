# IPC por grupos para la calculadora /inflacion/: guarda datos/ipc-grupos.json con el último mes que publica el INE.
# El INE publica a las 9:00 (hora peninsular); se mira cada día a las 10:20 y solo se guarda si cambia.
name: Datos del INE
on:
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ine
  cancel-in-progress: true
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Leer el IPC por grupos
        run: mkdir -p datos && python3 scripts/ine_ipc.py datos/ipc-grupos.json
      - name: Guardar si ha cambiado
        run: |
          if git diff --quiet -- datos/ipc-grupos.json && git ls-files --error-unmatch datos/ipc-grupos.json >/dev/null 2>&1; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/ipc-grupos.json
          git commit -m "IPC por grupos del INE"
          git pull --rebase origin main && git push || { sleep 5; git pull --rebase origin main && git push; }
