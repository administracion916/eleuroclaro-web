# Titulares de prensa económica para la portada: cada hora de 7:00 a 23:00 (hora peninsular) guarda prensa.json.
name: Titulares de prensa
on:
  schedule:
    - cron: "7 5-21 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prensa
  cancel-in-progress: true
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Leer titulares
        run: python3 scripts/prensa.py prensa.json
      - name: Guardar si han cambiado
        run: |
          if git diff --quiet -- prensa.json; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prensa.json
          git commit -m "Titulares de prensa"
          git pull --rebase origin main
          git push
