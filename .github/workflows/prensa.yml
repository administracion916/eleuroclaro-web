# Titulares de prensa económica para la portada: guarda prensa.json cada hora de 7:00 a 23:00 (hora peninsular).
# GitHub usa hora UTC: 5-22 cubre ese horario en verano (UTC+2) y en invierno (UTC+1).
name: Titulares de prensa
on:
  schedule:
    - cron: "23 5-22 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prensa
  cancel-in-progress: true
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # El repositorio pesa unos 3,6 GB por los vídeos e imágenes: se baja solo lo que usa esta tarea.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/prensa.py
            prensa.json
          sparse-checkout-cone-mode: false
          filter: blob:none
      - name: Leer titulares
        run: python3 scripts/prensa.py prensa.json
      - name: Guardar si han cambiado
        run: |
          if git diff --quiet -- prensa.json; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Se guarda el archivo nuevo, se baja la última versión de la rama y se pone encima:
          # con una copia de un solo commit, «git pull --rebase» da conflictos falsos si la rama ha avanzado.
          cp prensa.json "$RUNNER_TEMP/prensa.json"
          for intento in 1 2 3; do
            git fetch -q --depth=1 origin "$GITHUB_REF_NAME"
            git reset -q --hard FETCH_HEAD
            cp "$RUNNER_TEMP/prensa.json" prensa.json
            if git diff --quiet -- prensa.json; then echo "Sin cambios"; exit 0; fi
            git add prensa.json
            git commit -q -m "Titulares de prensa"
            if git push -q origin HEAD:"$GITHUB_REF_NAME"; then exit 0; fi
            sleep 5
          done
          exit 1
